[package]
name = "redirect"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true

[lib]
crate-type = ["rlib", "cdylib"] #'rlib' just for cocrew unit test.
name = "redirect64"

[dependencies]
tools = { path = "../tools" }
tokio = { version = "1.41.1", features = ["sync", "rt", "rt-multi-thread"] }
winapi = {version = "0.3.9", features = ["winbase", "handleapi", "minwindef", "consoleapi", "winnt", "memoryapi", "namedpipeapi", "winuser", 
                            "errhandlingapi", "winerror", "processenv", "synchapi", "debugapi", "ioapiset"]}
#ntapi = "0.4.1"
chrono = "0.4.38"
windows-sys = {version = "0.60", features = ["Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Storage_FileSystem"]}

[dev-dependencies]
tokio = { version = "1.41.1", features = ["sync", "rt", "rt-multi-thread", "time", "net", "io-util"] }

[build-dependencies]

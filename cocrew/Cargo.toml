[package]
name = "cocrew"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true


[dependencies]
tools = { path = "../tools" }
crew = { path = "../crew" }
redirectdll = { package = "redirect", path = "../redirect" }

tonic = "0.14.2"
prost = "0.14.1"
tonic-prost = "0.14.2"
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread"] }
tokio-stream = "0.1.16"
log = "0.4.22"
zip = {version = "2.2.0", features = ["zstd"]}
winapi = {version = "0.3.9", features = ["errhandlingapi", "processthreadsapi", "winbase", "namedpipeapi", "synchapi", "winerror"]}
windows-sys = {version = "0.60.2", features = ["Win32_System_Pipes"]}
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.129"

#tracing = "0.1.41"
#console-subscriber = "0.4.1"

[build-dependencies]
tonic-prost-build = "0.14.2"

[dev-dependencies]
winapi = {version = "0.3.9", features = ["errhandlingapi", "processthreadsapi", "winbase", "namedpipeapi", "synchapi", "winerror"]}
windows-sys = { version = "0.60.2", features = ["Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }
redirectdll = { package = "redirect", path = "../redirect" }

[package]
name = "cocrew"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true


[dependencies]
tools = { path = "../tools" }
crew = { path = "../crew" }

tonic = "0.12.3"
prost = "0.13.3"
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread"] }
tokio-stream = "0.1.16"
log = "0.4.22"
zip = {version = "2.2.0", features = ["zstd"]}
winapi = {version = "0.3.9", features = ["errhandlingapi", "processthreadsapi", "winbase", "namedpipeapi", "synchapi"]}

[build-dependencies]
tonic-build = "0.12.3"
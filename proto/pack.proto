syntax = "proto3";

package pack;

message Envs {
    string key = 1;
    string value = 2;    
}

message CompileTrRequest {
    string solution = 1;
    string project = 2;
    string file = 3;
    string compiler = 4;
    string working_dir = 5;
    string variety = 6;
    repeated string commands = 7;
    repeated Envs envs = 8; 
    bytes content = 9;
    repeated string presyncfiles = 10;
}

enum CompileProgress {
    OTHER = 0;
    FILETRANSFER = 1;
    COMPILESTART = 2;
    COMPILING = 3;
    COMPILEDONE = 4;
    STARTLINK = 5;
    LINKDONE = 6;
}

message IntermediateResult {
    string file = 1;
    bytes content = 2;
}

message CompileTrResponse {
    CompileProgress progress = 1;
    bytes out = 2;
    bytes err = 3;
    repeated IntermediateResult results = 4;
    uint32 status = 5;
    string tips = 6;
}

enum FileType {
    UNKNOWN = 0;
    SOURCEFILES = 1;
    PRECOMPILEDSRCFILES = 2;
    TOOLCHAIN = 3;
    KITS = 4;
    SYNCTASKCOUNT = 5;
    FINISH = 6;
}

message FileTrRequest {
    FileType file_type = 1;
    string solution = 2;
    string project = 3;
    string name = 4;
    string path = 5;
    bytes content = 6;
}

message FileTrResponse {
    string path = 1;
    bytes content = 2;
    int32 error_code = 3;
    string error_message = 4;
}

message Params {
    string key = 1;
    string value = 2;
}

message RemoteSyscall {
    uint32 cid = 1;
    string api = 2;
    repeated Params params = 3;
}

message LocalSyscall {
    uint32 cid = 1;
    string api = 2;
    repeated Params params = 3;
    repeated IntermediateResult files = 4;
}

service communicate {
    rpc transmit_file(stream FileTrRequest) returns (stream FileTrResponse) {}
    rpc transmit_task(CompileTrRequest) returns (stream CompileTrResponse) {}
    rpc transmit_syscall(stream LocalSyscall) returns (stream RemoteSyscall) {}
}

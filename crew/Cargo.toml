[package]
name = "crew"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true


[dependencies]
tools = { path = "../tools" }

tonic = "0.14.2"
prost = "0.14.1"
tonic-prost = "0.14.2"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.129"
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread", "process", "fs"] }
tokio-stream = "0.1.16"
sysinfo = "0.32.0"
regex = "1.11.0"
log = "0.4.17"
dashmap = "6.2.1"
zip = {version = "2.2.0", features = ["zstd"]}
windows-sys = {version = "0.60.2", features = ["Win32_System_Registry", "Wdk_Foundation", "Win32_Security", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Memory"]}
bytes = "1.11.1"
rayon = "1.12.0"
#tracing = "0.1.41"
#console-subscriber = "0.4.1"


[build-dependencies]
tonic-prost-build = "0.14.2"

[dev-dependencies]
windows-sys = {version = "0.60.2", features = ["Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Storage_FileSystem"]}

[features]
enforce_activate_local_cocrew = []
fake = []
default = ["enforce_activate_local_cocrew"]